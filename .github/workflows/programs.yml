name: programs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # run on any branch, e.g. to take its regenerated IDLs from the artifact

permissions:
  contents: read

env:
  AGAVE_VERSION: v2.3.13
  ANCHOR_VERSION: 0.31.1
  CARGO_TERM_COLOR: always

jobs:
  # Unit tests, the end-to-end perps flow and the Raydium graduation test. All run
  # natively (processor entry points), so no Solana toolchain is needed here.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test -p ringside_perps -p ringside_launch
      - run: cargo test
        working-directory: tests
      - run: cargo test
        working-directory: tests-graduation

  # SBF builds, mainnet and devnet. Fails on any SBF stack-frame warning (the same
  # rule upgrade.sh and mainnet.sh enforce before deploying), and on committed
  # (mainnet) IDLs that no longer match the source.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Agave and Anchor
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agave" "$HOME/.local/bin"
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/$AGAVE_VERSION/solana-release-x86_64-unknown-linux-gnu.tar.bz2" \
            | tar -xj -C "$RUNNER_TEMP/agave"
          echo "$RUNNER_TEMP/agave/solana-release/bin" >> "$GITHUB_PATH"
          curl -sSfL -o "$HOME/.local/bin/anchor" \
            "https://github.com/solana-foundation/anchor/releases/download/v$ANCHOR_VERSION/anchor-$ANCHOR_VERSION-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly --profile minimal   # Anchor's IDL step
      - run: anchor --version && solana --version
      # Mainnet build first: the committed IDLs are the mainnet ones (the devnet
      # feature swaps in Raydium's devnet addresses, which end up in the IDL).
      - name: anchor build (mainnet)
        run: |
          set -o pipefail
          anchor build 2>&1 | tee build-mainnet.log
      - name: anchor build (devnet feature, programs only)
        run: |
          set -o pipefail
          cp -r target/idl "$RUNNER_TEMP/idl-mainnet"
          anchor build --no-idl -- --features devnet 2>&1 | tee build-devnet.log
          rm -rf target/idl && cp -r "$RUNNER_TEMP/idl-mainnet" target/idl
      - name: No SBF stack-frame warnings
        run: |
          if grep -qi "stack offset" build-mainnet.log build-devnet.log; then
            grep -i "stack offset" build-mainnet.log build-devnet.log | sort -u
            echo "::error::A program function overflows the 4 KB SBF stack frame"
            exit 1
          fi
      # Always saved, so the IDLs can be taken from CI when no local machine can
      # run Anchor's IDL step (it needs a nightly toolchain).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: idl
          path: target/idl/*.json
          if-no-files-found: ignore
      # Manual runs also print the regenerated IDLs (gzip + base64 between markers),
      # for environments that can read run logs but not download artifacts.
      - name: Print regenerated IDLs (manual runs)
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          echo "IDL-BUNDLE-BEGIN"
          tar -czf - target/idl/*.json | base64 -w0
          echo
          echo "IDL-BUNDLE-END"
      - name: Committed IDLs match the source
        run: |
          if ! git diff --exit-code --stat -- target/idl; then
            git diff -- target/idl | head -150
            echo "::error::target/idl is stale: run anchor build and commit target/idl (or take the idl artifact from this run)"
            exit 1
          fi

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: for f in scripts/*.sh; do bash -n "$f"; done
      # A Solana CLI config file missing fields is silently ignored and the CLI falls
      # back to mainnet-beta (the services.sh relayer top-up bug). Any script that
      # writes one must write websocket_url too.
      - name: Solana CLI config files are complete
        run: |
          bad=$(grep -n "json_rpc_url:" scripts/*.sh | grep -v "^[^:]*:[0-9]*:\s*#" | grep -v "websocket_url" || true)
          if [ -n "$bad" ]; then echo "$bad"; echo "::error::incomplete Solana CLI config (add websocket_url, address_labels, commitment)"; exit 1; fi
